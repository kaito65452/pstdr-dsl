[package]
name = "pstdr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary (pstdr-c) for the .pstdr Bedrock Add-On DSL"

[[bin]]
name = "pstdr-c"
path = "src/main.rs"

[dependencies]
pstdr-lang = { path = "../pstdr-lang" }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
